# ---- サーバー設定 ----
# 学習用APIのポート。EC2のセキュリティグループでもこのポートを開ける。
server.port=8080
# すべてのネットワークインターフェースで待ち受ける（EC2のパブリックIP経由で接続するため）。
server.address=0.0.0.0

# ---- CORS設定 ----
# 画面を配信するオリジンを環境変数 ALLOWED_ORIGINS で切り替える。
# カンマ区切りで複数指定できる。スキーム・ホスト・ポートまでを書き、パスや末尾の / は含めない。
#   ローカル例 : http://localhost:8000
#   S3の例     : http://<バケット名>.s3-website-<リージョン>.amazonaws.com
# 環境変数が未設定のときはローカル開発用の値を使う。
janken.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8000}

# ---- エラー応答 ----
# 例外の詳細やスタックトレースを利用者へ返さない。
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
